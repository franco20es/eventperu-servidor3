# ??? PAYMENT SERVICE ???
spring.application.name=payment-service
server.port=${SERVER_PORT:8084}

# Base de datos
spring.datasource.url=jdbc:postgresql://${PAYMENT_DB_HOST:localhost}:5432/${PAYMENT_DB_NAME:paymentdb}
spring.datasource.username=${PAYMENT_DB_USER:postgres}
spring.datasource.password=${PAYMENT_DB_PASSWORD:123zrsasa}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# JWT
jwt.secret=${JWT_SECRET:default_secret}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
app.kafka.enabled=${KAFKA_ENABLED:false}

# MercadoPago
mercadopago.access-token=${MP_ACCESS_TOKEN:XD}

mercadopago.public-key=${MP_PUBLIC_KEY:XD}
app.mp-sandbox=${MP_SANDBOX:false}


# Frontend
app.frontend-url=${FRONTEND_URL:https://eventperu.francowe.me}

# SUNAT - Configuracion completa
sunat.ruc=${SUNAT_RUC:XD}
sunat.razon-social=${SUNAT_RAZON_SOCIAL:XD}
sunat.usuario-sol=${SUNAT_USER:MODDATOS}
sunat.clave-sol=${SUNAT_PASS:moddatos}
sunat.certificado-path=${SUNAT_CERT_PATH:classpath:certificado/sunat_prueba.pfx}
sunat.certificado-password=${SUNAT_CERT_PASS:sunat_prueba}
sunat.url-beta=${SUNAT_URL_BETA:https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService}
sunat.url-produccion=${SUNAT_URL_PROD:https://e-factura.sunat.gob.pe/ol-ti-itcpfegem/billService}
sunat.modo=${SUNAT_MODO:beta}

